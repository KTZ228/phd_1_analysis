overwrite_simnibs: 0

# Structure of subfolders containing T1 and T1 images
## It is easier to store the subject data of each participant in an individual subfolder
t1_path_template: sub-%1$03d/*T1w.nii.gz
t2_path_template: sub-%1$03d/*T2w.nii.gz

transducer: 
  n_elements: 30 # number of elements in the transducer
  Elements_ID_mm: [10, 13.7667, 17.5333, 22.3, 24.5667, 26.8333, 30, 31.7667, 33.5333, 36.3, 37.7667, 39.2333, 41.7, 43.0, 44.3, 46.5, 47.6667, 48.8333, 51, 52.0333, 53.0667, 55.1, 56.0667, 57.0333, 58.9, 59.8, 60.7, 62.5, 63.3333, 64.1667]
  Elements_OD_mm: [13.7667, 17.5333, 21.3, 24.5667, 26.8333, 29.1, 31.7667, 33.5333, 35.3, 37.7667, 39.2333, 40.7, 43.0, 44.3, 45.6, 47.6667, 48.8333, 50, 52.0333, 53.0667, 54.1, 56.0667, 57.0333, 58, 59.8, 60.7, 61.6, 63.3333, 64.1667, 65]
  curv_radius_mm: 75 # radius of curvature of the bowl 
  dist_to_plane_mm: 65.3 # distance to the transducer plane from the geometric focus
  source_amp: 143733 # [Pa]
  source_phase_deg: [0, 216.73, 104.05, 92.32, 73.29, 66.23, 123.21, 131.14, 121.07, 131.73, 138.19, 149.58, 177.01, 206.43, 219.7, 253.91, 253.98, 260.83, 264.32, 274.12, 287.41, 289.86, 282.39, 167.04, 214.57, 262.3, 236.16, 163.3, 129.69, 36.28] # source phase [deg]
  pos_t1_grid: [84,182,262] #[84,182,250]
  source_freq_hz: 300e3 # [Hz] the central frequency

focus_pos_t1_grid: [103,172,208]

transducer_from_localite: 0 # should we load the transducer locations from the localite file(s) 

using_donders_hpc: 1
overwrite_simnibs: 0
use_forceqform: 1

run_posthoc_water_sims: 1
run_heating_sims: 1
run_acoustic_sims: 1

start_break_trials: [67, 247, 427] # End of the active stimulation phase, defined as (40/on-off cycle duration)+1;
stop_break_trials: [180, 360, 540] # End of the inactive stimulation phase, defined as (100/on-off cycle duration);
# Both of these can be defined as lists if you need multiple on- and off- periods
## on-off cycle is 0.2s for this protocol

thermal:
  duty_cycle: 0.1 # this actually is the duty_cycle
  n_trials: 540 # end of stop_break_trials

  # These should only be changed if they don't meet the criteria described in "run_heating_simulations"
  sim_time_steps: 0.1 # [s] simulation time steps during the stimulation period
  post_stim_time_step_dur: 1 # post-stimulation (inter-trial) steps
  on_off_step_duration: 0.6 # duration of the on+off cycle (e.g., with a duty cycle of 0.3 and 0.01 s time steps for simulation, the whole on+off cycle will take 0.1 s)
  equal_steps: 0 # is the duration of the simulation steps equal for on and off steps? if not, it is computed based on the sim_time_steps * n_steps where n_steps is the needed number of on and off steps derived from the duty cycle