# Location of stored data
data_path: /project/3025011.02/raw_data/anatomical_data/
seg_path: /project/3025011.02/TUS_simulations/segmentation_data/
simnibs_bin_path: /home/affneu/kenvdzee/SimNIBS-4.0/bin/
subject_subfolder: 1
